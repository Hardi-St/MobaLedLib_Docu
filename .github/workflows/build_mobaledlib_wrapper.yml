name: Build MobaLedLibWrapper DLL

on:
  push:
    branches: [ master ]
    paths:
      - 'Tools/MobaLedLib.Win/**'
      - '.github/workflows/build_mobaledlib_wrapper.yml'
  pull_request:
    paths:
      - 'Tools/MobaLedLib.Win/**'
  workflow_dispatch:

jobs:
  build-wrapper:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build wrapper DLL for x64 and x86
        shell: pwsh
        run: |
          $project = "Tools/MobaLedLib.Win/MobaLedLibWrapper/MobaLedLibWrapper.vcxproj"
          $artifactsRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactsRoot | Out-Null

          foreach ($platform in @("x64", "Win32")) {
            $outDir = Join-Path $artifactsRoot $platform
            New-Item -ItemType Directory -Force -Path $outDir | Out-Null

            msbuild $project `
              /p:Configuration=Release `
              /p:Platform=$platform `
              /p:PlatformToolset=v143 `
              /p:OutDir="$outDir\\" `
              /m `
              /verbosity:minimal

            if (-not (Test-Path (Join-Path $outDir "MobaLedLibWrapper.dll"))) {
              throw "Build failed for platform $platform: MobaLedLibWrapper.dll not found in $outDir"
            }
          }

      - name: Upload wrapper DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobaLedLibWrapper-Windows
          path: |
            artifacts/x64/MobaLedLibWrapper.dll
            artifacts/Win32/MobaLedLibWrapper.dll
          if-no-files-found: error
