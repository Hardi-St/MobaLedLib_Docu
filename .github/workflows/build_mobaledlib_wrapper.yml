name: Build MobaLedLibWrapper DLL

on:
  push:
    branches: [ master ]
    paths:
      - 'Tools/MobaLedLib.Win/**'
      - '.github/workflows/build_mobaledlib_wrapper.yml'
  pull_request:
    paths:
      - 'Tools/MobaLedLib.Win/**'
  workflow_dispatch:

jobs:
  build-wrapper:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Build wrapper DLL for x64 and Win32
        shell: pwsh
        run: |
          $project = "Tools/MobaLedLib.Win/MobaLedLibWrapper/MobaLedLibWrapper.vcxproj"
          $artifactRoot = Join-Path $env:GITHUB_WORKSPACE "artifacts"
          New-Item -ItemType Directory -Force -Path $artifactRoot | Out-Null

          foreach ($platform in @("x64", "Win32")) {
            $config = "Release"
            msbuild $project `
              /p:Configuration=$config `
              /p:Platform=$platform `
              /p:PlatformToolset=v143 `
              /m `
              /verbosity:minimal

            $builtDll = Get-ChildItem -Path "Tools/MobaLedLib.Win" -Recurse -Filter "MobaLedLibWrapper.dll" | Where-Object { $_.FullName -match "\\$platform\\|\\$config\\" } | Select-Object -First 1

            if (-not $builtDll) {
              $builtDll = Get-ChildItem -Path "Tools/MobaLedLib.Win" -Recurse -Filter "MobaLedLibWrapper.dll" | Select-Object -First 1
            }

            if (-not $builtDll) {
              throw "Build did not produce MobaLedLibWrapper.dll for platform $platform"
            }

            $targetDir = Join-Path $artifactRoot $platform
            New-Item -ItemType Directory -Force -Path $targetDir | Out-Null
            Copy-Item -Path $builtDll.FullName -Destination (Join-Path $targetDir "MobaLedLibWrapper.dll") -Force
          }

      - name: Upload wrapper DLL artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MobaLedLibWrapper-Windows
          path: |
            artifacts/x64/MobaLedLibWrapper.dll
            artifacts/Win32/MobaLedLibWrapper.dll
          if-no-files-found: error
